http_port 3128

acl CONNECT method CONNECT
acl ssl_ports port 443
acl safe_ports port 443

acl production dstdomain .estetia.it
acl qa_preprod dstdomain estetia.tidycode.it
acl codex_api dstdomain .openai.com .chatgpt.com .oaistatic.com .oaiusercontent.com

http_access deny production
http_access deny !safe_ports
http_access deny CONNECT !ssl_ports
http_access allow CONNECT qa_preprod ssl_ports
http_access allow CONNECT codex_api ssl_ports
http_access deny all

cache deny all
via off
forwarded_for delete
request_header_access X-Forwarded-For deny all
request_header_access Via deny all
request_header_access Cache-Control deny all

access_log stdio:/dev/stdout
cache_log /dev/stderr
pid_filename none
coredump_dir /tmp
pinger_enable off
